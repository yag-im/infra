# Install NVIDIA driver (from Debian non-free) and NVIDIA Container Toolkit.
#

# Refs:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#   https://wiki.debian.org/NvidiaGraphicsDrivers

- name: nvidia | enable Debian non-free and non-free-firmware apt components
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian {{ ansible_distribution_release }} main contrib non-free non-free-firmware"
    state: present
    filename: debian-non-free

- name: nvidia | install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - dkms
      - gnupg
      - linux-headers-amd64
    state: present
    update_cache: yes

- name: nvidia | install nvidia-driver from Debian non-free
  ansible.builtin.apt:
    name:
      - nvidia-driver
      - firmware-misc-nonfree
    state: present

# ---------- NVIDIA Container Toolkit ----------

- name: nvidia | add NVIDIA Container Toolkit gpg key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit.gpg.asc
    mode: "0644"

- name: nvidia | dearmor NVIDIA Container Toolkit gpg key
  ansible.builtin.shell: |
    set -euo pipefail
    gpg --dearmor < /tmp/nvidia-container-toolkit.gpg.asc \
      > /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: nvidia | add NVIDIA Container Toolkit apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /

- name: nvidia | refresh apt cache after adding NVIDIA Container Toolkit repo
  ansible.builtin.apt:
    update_cache: yes

- name: nvidia | install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit
    state: present

- name: nvidia | configure docker runtime via nvidia-ctk
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk_configure
  changed_when: true

- name: nvidia | restart docker to pick up nvidia runtime
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: yes
  when: nvidia_ctk_configure is changed

- name: pre-pull gpu-nvidia runners images
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  loop:
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_dosbox:{{ jukebox_dosbox_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_dosbox-x:{{ jukebox_dosbox_x_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_dosbox-staging:{{ jukebox_dosbox_staging_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_qemu:{{ jukebox_qemu_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_retroarch:{{ jukebox_retroarch_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_scummvm:{{ jukebox_scummvm_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_wine:{{ jukebox_wine_ver }}"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_wine:10.0"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_scummvm:2.9.0"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_scummvm:2.9.1"
    - "{{ jukebox_docker_repo }}/x11_gpu-nvidia_dosbox-x:2024.12.04"