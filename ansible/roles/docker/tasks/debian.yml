- name: install deps
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-debian  # required by deb822_repository
    state: present
    update_cache: yes

- name: download docker gpg key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: "/usr/share/keyrings/docker-archive-keyring.gpg"
    mode: '0644'

- name: add docker apt repo
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /usr/share/keyrings/docker-archive-keyring.gpg
    state: present

# superseded by docker.sources above; left behind by the former apt_repository task
- name: remove legacy one-line docker apt repo
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: update apt cache after adding docker repo
  ansible.builtin.apt:
    update_cache: yes

- name: install docker
  package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - python3-docker
    state: present
