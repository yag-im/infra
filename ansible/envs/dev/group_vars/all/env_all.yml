admin_email: admin-yag@acme.im
infra_env: dev
# otelcol gateway is hidden behind istio-gw-private ip
# TODO: sync with `kubectl get svc -n istio-gw-private istio-gw-private` output
otelcol_gw_ip: 192.168.1.103

jukebox_node_private_ip: "{{ ansible_eno2.ipv4.address }}"
jukebox_node_public_ip: "{{ ansible_eno1.ipv4.address }}"

appstor_node_private_ip: "{{ ansible_ens3.ipv4.address }}"

appstor_master: "appstor0-us-east-1"

appstor_replicas:
  - "appstor0-us-west-1"

# based on ceph block storage: 3x replicated under the hood so one device is enough
appstor_btrfs_devices:
  - "/dev/sdb"
appstor_btrfs_profile: single
